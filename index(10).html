<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UltraStream IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:Inter,Arial,sans-serif}
.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:15px;margin-bottom:15px}
.logo{font-size:23px;font-weight:900;white-space:nowrap}.logo b{color:#4ade80}.search{flex:1;background:#121720;border:1px solid #252d39;color:#fff;padding:12px 15px;border-radius:11px;outline:0}
.layout{display:grid;grid-template-columns:235px minmax(0,1fr) 330px;gap:15px}.panel,.player{background:#10141b;border:1px solid #202733;border-radius:14px;overflow:hidden}
.sources{padding:10px}.sources h3,.channels h3{font-size:13px;color:#9aa5b5;margin:8px 8px 10px;text-transform:uppercase;letter-spacing:.7px}
.src{width:100%;border:0;background:transparent;color:#dce2eb;text-align:left;padding:10px;border-radius:9px;cursor:pointer;margin-bottom:3px}
.src:hover{background:#181e27}.src.active{background:#183020;color:#6ee7a0}
.player video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.info{padding:13px 16px}.title{font-size:18px;font-weight:800}.status{color:#7f8a9a;font-size:12px;margin-top:5px}
.channels{padding:10px;max-height:calc(100vh - 115px);overflow:auto}.channel{display:flex;align-items:center;gap:10px;width:100%;padding:9px;background:#151a22;color:#fff;border:1px solid transparent;border-radius:10px;margin-bottom:7px;text-align:left;cursor:pointer}
.channel:hover{background:#1a202a}.channel.active{border-color:#4ade80;background:#17241c}
.chlogo{width:38px;height:38px;border-radius:8px;background:#0b0e13;object-fit:contain;flex:none}.cname{font-size:13px;font-weight:650;line-height:1.25}.meta{font-size:10px;color:#778294;margin-top:3px}
.empty{padding:30px 10px;text-align:center;color:#788394;font-size:13px}.loading{padding:18px;color:#8d98a8;font-size:13px}
@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.channels{grid-column:1/-1;max-height:430px}}
@media(max-width:650px){.app{padding:10px}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.layout{display:block}.sources{margin-bottom:10px}.player{margin-bottom:10px}.channels{max-height:480px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">Ultra<b>Stream</b></div>
    <input id="search" class="search" placeholder="Search channels..." autocomplete="off">
  </div>

  <div class="layout">
    <aside class="panel sources">
      <h3>Playlists</h3>
      <div id="sources"></div>
    </aside>

    <section class="player">
      <video id="video" controls playsinline></video>
      <div class="info">
        <div id="title" class="title">Select a channel</div>
        <div id="status" class="status">Choose a playlist</div>
      </div>
    </section>

    <aside class="panel channels">
      <h3 id="channelHeading">Channels</h3>
      <div id="channels"><div class="empty">Choose a playlist.</div></div>
    </aside>
  </div>
</div>

<script>
const PLAYLISTS = {
  "All Channels": "https://iptv-org.github.io/iptv/index.m3u",
  "Movies": "https://iptv-org.github.io/iptv/categories/movies.m3u",
  "News": "https://iptv-org.github.io/iptv/categories/news.m3u",
  "Sports": "https://iptv-org.github.io/iptv/categories/sports.m3u",
  "Music": "https://iptv-org.github.io/iptv/categories/music.m3u",
  "Kids": "https://iptv-org.github.io/iptv/categories/kids.m3u",
  "Documentary": "https://iptv-org.github.io/iptv/categories/documentary.m3u",
  "Entertainment": "https://iptv-org.github.io/iptv/categories/entertainment.m3u",
  "Weather": "https://iptv-org.github.io/iptv/categories/weather.m3u",
  "🇺🇸 USA": "https://iptv-org.github.io/iptv/countries/us.m3u",
  "🇬🇧 UK": "https://iptv-org.github.io/iptv/countries/gb.m3u",
  "🇨🇦 Canada": "https://iptv-org.github.io/iptv/countries/ca.m3u",
  "🇦🇺 Australia": "https://iptv-org.github.io/iptv/countries/au.m3u",
  "🇩🇪 Germany": "https://iptv-org.github.io/iptv/countries/de.m3u",
  "🇫🇷 France": "https://iptv-org.github.io/iptv/countries/fr.m3u",
  "🇪🇸 Spain": "https://iptv-org.github.io/iptv/countries/es.m3u",
  "English": "https://iptv-org.github.io/iptv/languages/eng.m3u",
  "Spanish": "https://iptv-org.github.io/iptv/languages/spa.m3u"
};

const video=document.getElementById("video"), sources=document.getElementById("sources"),
channels=document.getElementById("channels"), search=document.getElementById("search"),
title=document.getElementById("title"), status=document.getElementById("status"),
heading=document.getElementById("channelHeading");
let hls=null, all=[], current=null, activeName="";

function makeSources(){
  Object.entries(PLAYLISTS).forEach(([name,url],i)=>{
    const b=document.createElement("button"); b.className="src"+(i===0?" active":"");
    b.textContent=name; b.onclick=()=>loadPlaylist(name,url,b); sources.appendChild(b);
  });
}
function attr(s,key){const m=s.match(new RegExp(key+'="([^"]*)"','i'));return m?m[1]:"";}
function parseM3U(txt){
  const lines=txt.split(/\r?\n/), out=[]; let info=null;
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith("#EXTINF:")) info=line;
    else if(!line.startsWith("#") && info){
      const name=(info.split(",").slice(1).join(",").trim())||"Unknown Channel";
      out.push({name,url:line,logo:attr(info,"tvg-logo"),group:attr(info,"group-title"),id:attr(info,"tvg-id")});
      info=null;
    }
  } return out;
}
async function loadPlaylist(name,url,button){
  document.querySelectorAll(".src").forEach(x=>x.classList.remove("active")); button.classList.add("active");
  activeName=name; heading.textContent=name; channels.innerHTML='<div class="loading">Loading channels...</div>';
  try{
    const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
    all=parseM3U(await r.text()); render(); status.textContent=all.length+" channels loaded";
  }catch(e){
    channels.innerHTML='<div class="empty">Could not load this playlist.<br><br>Check your internet connection or browser CORS restrictions.</div>';
    status.textContent="Playlist loading failed";
  }
}
function render(){
  const q=search.value.toLowerCase().trim();
  const list=all.filter(c=>(c.name+" "+c.group).toLowerCase().includes(q));
  channels.innerHTML="";
  if(!list.length){channels.innerHTML='<div class="empty">No channels found.</div>';return}
  list.forEach(c=>{
    const b=document.createElement("button"); b.className="channel"+(current===c?" active":"");
    const img=document.createElement("img"); img.className="chlogo"; img.alt=""; img.src=c.logo||"";
    img.onerror=()=>{img.style.visibility="hidden"};
    const wrap=document.createElement("div"), n=document.createElement("div"), m=document.createElement("div");
    n.className="cname";n.textContent=c.name;m.className="meta";m.textContent=c.group||"Live";
    wrap.append(n,m);b.append(img,wrap);b.onclick=()=>play(c);channels.appendChild(b);
  });
}
function play(c){
  current=c; title.textContent=c.name; status.textContent="Connecting..."; render();
  if(hls){hls.destroy();hls=null} video.pause(); video.removeAttribute("src"); video.load();
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:true,backBufferLength:30,maxBufferLength:20,liveSyncDurationCount:2});
    hls.loadSource(c.url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent="LIVE";video.play().catch(()=>{})});
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal) status.textContent="Stream error"});
  }else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=c.url;video.onloadedmetadata=()=>{status.textContent="LIVE";video.play().catch(()=>{})};
  }else status.textContent="HLS not supported in this browser";
}
search.oninput=render; video.onwaiting=()=>{if(current)status.textContent="Buffering..."}; video.onplaying=()=>{if(current)status.textContent="LIVE"};
makeSources();
loadPlaylist("All Channels",PLAYLISTS["All Channels"],sources.querySelector(".src"));
</script>
</body>
</html>
